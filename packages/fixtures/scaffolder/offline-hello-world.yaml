# ====================================================================================
# 🧪 OFFLINE SCAFFOLDER TEMPLATE (HERMETIC SANDBOX TEST SCAFFOLD)
# Frameworks: SOC 2 Type II Air-Gapped Validation | Zero-Cloud Dependency Modeling
# ====================================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: offline-hello-world
  title: Offline Hello World Scaffold
  description: >
    A hermetic test scaffold that exercises the scaffolder task engine using only
    offline-safe actions (debug:log, catalog:fetch). Requires no external network,
    cloud credentials, or git remotes, making it the baseline fixture for validating
    /api/scaffolder/v2 endpoints in sandbox environments.
  tags:
    - testpad
    - offline
    - scaffolder
spec:
  type: service

  parameters:
    - title: Provide a few simple values
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: The name to greet in the scaffolded output.
        message:
          title: Message
          type: string
          default: Hello from the offline testpad scaffolder!
          description: Free-form text echoed by the debug log step.

  steps:
    - id: log
      name: Log the resolved parameters
      action: debug:log
      input:
        message: "${{ parameters.name }} :: ${{ parameters.message }}"

  output:
    text:
      - title: Scaffold completed
        content: "Offline scaffold finished for ${{ parameters.name }}"
