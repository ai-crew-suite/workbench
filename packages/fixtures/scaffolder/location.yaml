# yaml-language-server: $schema=../../custom-catalog-kinds/src/catalog.schema.json
# ====================================================================================
# 📡 MASTER RECURSIVE DISCOVERY GATEWAY (MOCK GIT ENGINE)
# ====================================================================================

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform-workbench-autodiscovery
  description: Automatically crawls and indexes all loose mock catalog entities across the workspace.
spec:
  type: file
  # Optional presence: glob targets that match zero files (e.g. no *.yml
  # fixtures exist yet) must not fail processing, which would discard every
  # entity emitted by the matching globs.
  presence: optional
  targets:
    - ./catalog/**/*.yaml
    - ./catalog/**/*.yml
    - ./scaffolder/**/*.yaml
    - ./scaffolder/**/*.yml
