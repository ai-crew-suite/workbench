# ====================================================================================
# 🛡️ PLATFORM SOFTWARE CATALOG MOCK FIXTURES (HIGH-FIDELITY ECOSYSTEM)
# Frameworks: SOC 2 Type II Compliance | Invariant Governance Modeling
# ====================================================================================

apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: agentic-capabilities
  description: Core autonomous operational and cognitive reasoning capabilities for the enterprise.
spec:
  owner: platform-team

---

apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: crew-suite
  description: The integrated AI Crew Suite engine comprising orchestration runtimes, interfaces, and tools.
spec:
  owner: platform-team
  domain: agentic-capabilities

---

# 🤖 1. CORE ORCHESTRATION ENGINE COMPONENT
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform
  description: Core workflow execution service managing Temporal pipelines and Mem0 long-term memory tracks.
  annotations:
    # Forces Backstage to parse local pre-compiled HTML documentation instead of querying the cloud
    backstage.io/techdocs-ref: dir:.
    temporal.io/namespace: ai-crew-suite-prod
    # 🎯 THE PAGERDUTY CORRELATION BINDING:
    # Tells the plugin exactly what integration service key to filter by when querying incidents
    ://pagerduty.com: SRV-PLATFORM
    # 🎯 THE DATADOG CORRELATION BINDING:
    # Instructs the telemetry plugin exactly which dashboard matrix block to query and render
    ://datadoghq.com: https://datadoghq.com
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: crew-suite
  providesApis:
    - platform-workflow-api

---

# 🔌 2. INTEGRATION DRIVERS COMPONENT
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: drivers
  description: Third-party integration tools exposing platforms like PagerDuty and Datadog as functional agents.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: library
  lifecycle: production
  owner: tools-crew-team
  system: crew-suite
  dependsOn:
    - component:platform

---

# 💻 3. USER-FACING FRONTEND/BACKEND APPLICATION
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: agents
  description: User-facing dashboard portal and orchestration gateway assembling core workflows and telemetry plugins.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: website
  lifecycle: production
  owner: product-ux-team
  system: crew-suite
  dependsOn:
    - component:platform
    - component:drivers

---

# 📡 4. SYSTEM BOUNDARY AUTOMATED INGESTION ENDPOINT
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: local-workspace-discovery
  description: Automated local path index scanning for sandbox testing routines.
spec:
  type: file
  # Automatically instructs the Backstage ingestion loop to watch for local variations safely
  targets:
    - ./catalog-fixtures.yaml
