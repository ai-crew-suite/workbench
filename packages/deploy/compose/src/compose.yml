name: workbench

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-postgres-credentials: &postgres-credentials
  POSTGRES_DB: "${POSTGRES_DB:-postgres_workbench}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_secret_pass}"
  POSTGRES_USER: "${POSTGRES_USER:-workbench}"

x-postgres-env: &postgres-env
  <<: *postgres-credentials
  POSTGRES_HOST: pgvector
  POSTGRES_PORT: "5432"

services:
  grafana:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/grafana-container:${IMAGE_TAG:-latest}
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    volumes:
      - grafana_data_volume:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0]

  mem0:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/mem0-container:${IMAGE_TAG:-latest}
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      <<: *postgres-env
      MEM0_EMBEDDER_MODEL: "${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}"
      MEM0_EMBEDDER_PROVIDER: "${MEM0_EMBEDDER_PROVIDER:-openai}"
      MEM0_LLM_MAX_TOKENS: "${MEM0_LLM_MAX_TOKENS:-}"
      MEM0_LLM_MODEL: "${MEM0_LLM_MODEL:-gpt-4o-mini}"
      MEM0_LLM_PROVIDER: "${MEM0_LLM_PROVIDER:-openai}"
      MEM0_LLM_TEMPERATURE: "${MEM0_LLM_TEMPERATURE:-}"
      MEM0_PROVIDER_API_KEY: "${MEM0_PROVIDER_API_KEY:-}"
      JWT_SECRET: "${MEM0_JWT_SECRET:-}"
      AUTH_DISABLED: "${MEM0_AUTH_DISABLED:-true}"
    networks:
      default:
        aliases:
          - mem0-service
    healthcheck:
      <<: *healthcheck
      test: [CMD, nc, -z, 127.0.0.1, "8000"]

  otel-collector:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/otel-container:${IMAGE_TAG:-latest}
    depends_on:
      tempo:
        condition: service_started
    command: ["--config=/etc/otel-collector-config.yaml"]

  pgvector:
    image: pgvector/pgvector:pg18
    volumes:
      - pgdata_volume:/var/lib/postgresql
    environment:
      <<: *postgres-credentials
    healthcheck:
      <<: *healthcheck
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']

  prometheus:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/prometheus-container:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0]

  redis:
    image: redis:8.10-alpine
    volumes:
      - redis_volume:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, redis-cli, ping]

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0-alpine
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0]

  tempo:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/tempo-container:${IMAGE_TAG:-latest}
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      default:
        aliases:
          - tempo-backend

  temporal:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/temporal-container:${IMAGE_TAG:-latest}
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      <<: *postgres-env
      TEMPORAL_VISIBILITY_DB: "${TEMPORAL_VISIBILITY_DB:-temporal_visibility}"
    networks:
      default:
        aliases:
          - temporal-cluster
    healthcheck:
      <<: *healthcheck
      test: [CMD, nc, -z, 127.0.0.1, "7233"]
      retries: 24
      start_period: 20s

  wiremock:
    image: wiremock/wiremock:3.13.2-alpine
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      JAVA_OPTS: "-Dotel.traces.exporter=otlp -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.service.name=wiremock"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_TRACES_EXPORTER: "otlp"
    ports:
      - "127.0.0.1:${WIREMOCK_PORT:-8080}:8080"
    command:
      - --global-response-templating
      - --async-response-enabled=true
      - --enable-stub-cors
    healthcheck:
      <<: *healthcheck
      test: [CMD, nc, -z, 127.0.0.1, "8080"]

volumes:
  grafana_data_volume:
  pgdata_volume:
  redis_volume:
