# ====================================================================================
# 🛡️ COMPLIANCE & ORCHESTRATION LAYER (HIGH-COMPLIANCE SANDBOX)
# Frameworks: SOC 2 Type II | FINRA | HIPAA Data Isolation
# ====================================================================================
version: "3.8"

services:
  backstage-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    volumes:
      - .:/app
      - /app/node_modules # Prevents local node_modules from overriding container binaries
    ports:
      - "7007:7007"
    environment:
      NODE_ENV: development
    command: yarn workspace @internal/backend start
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backstage-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    volumes:
      - .:/app
      # Prevents host computer files from stepping over container-built assets
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MOCK_PROXY_URL: http://wiremock:8080 # Points to internal compose DNS name
    command: yarn workspace @internal/app start

  mem0:
    image: memcached:1.6-alpine
    container_name: crew-infra-mem0
    ports:
      - "11211:11211"
    healthcheck:
      test: ["CMD", "memcached-tool", "127.0.0.1:11211", "stats"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg18
    container_name: crew-infra-db
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${DB_PASSWORD:-backstage}
      POSTGRES_DB: backstage_plugin_catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d backstage_plugin_catalog",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  # 🏎️ Transient State Cache & Temporal Support Queue
  redis:
    image: redis:8.10-alpine
    container_name: crew-infra-cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "${TEMPORAL_ADDRESS##*:}:7233"
    environment:
      - DB=postgresql
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7233 || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 5s

  wiremock:
    image: wiremock/wiremock:3.13.2-alpine
    container_name: crew-infra-mocks
    ports:
      - "8080:8080"
    volumes:
      # 1. Mounts the routing rules folder
      - ./../mock-network/mappings:/home/wiremock/mappings:ro
      # 2. Mounts the unified data package straight into WireMock's asset roots
      - ./../mock-fixtures:/home/wiremock/__files:ro
    command:
      # Enables background scanning so adding new .json mapping files doesn't require a restart
      --global-response-templating
      --async-response-enabled=true
      --enable-cors # Allow direct browser-to-WireMock cross-origin requests in Storybook
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/__admin/health | grep -q 'OK' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: crew_platform_pgdata
  redisdata:
    name: crew_platform_redisdata
