version: "3.8"
name: workbench

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-postgres_workbench}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres-store}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_pass}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-workbench}

services:
  backend:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-backend:${IMAGE_TAG:-latest}
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-7007}:7007"
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      <<: *postgres-env
      REDIS_URL: redis://${REDIS_HOST_PORT:-redis:6379}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      MEM0_API_URL: ${MEM0_API_URL:-http://mem0:8000}
    command: ${BACKEND_START_CMD:-yarn workspace @internal/backend start}

  frontend:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-frontend:${IMAGE_TAG:-latest}
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      WIREMOCK_URL: http://wiremock:8080
    command: ${FRONTEND_START_CMD:-yarn workspace @internal/app start}

  grafana:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-grafana:${IMAGE_TAG:-latest}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - otel-collector
    volumes:
      - grafana_data_volume:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    healthcheck:
      test: ["CMD", "curl", "-f", "curl -f http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  mem0:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-mem0:${IMAGE_TAG:-latest}
    ports:
      - "${MEM0_PORT:-8000}:8000"
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      <<: *postgres-env
      MEM0_PORT: 8000
      MEM0_PROVIDER_API_KEY: ${MEM0_PROVIDER_API_KEY}
      MEM0_LLM_PROVIDER: ${MEM0_LLM_PROVIDER:-openai}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-gpt-4o-mini}
      MEM0_LLM_TEMPERATURE: ${MEM0_LLM_TEMPERATURE:-0.1}
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-openai}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-otel-collector:${IMAGE_TAG:-latest}
    ports:
      - "4317:4317"
    depends_on:
      - tempo
    command: ["--config=/etc/otel-collector-config.yaml"]

  pgvector:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
    environment:
      <<: *postgres-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  prometheus:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-prometheus:${IMAGE_TAG:-latest}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  redis:
    image: redis:8.10-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0-alpine
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    depends_on:
      - redis

  tempo:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-tempo:${IMAGE_TAG:-latest}
    ports:
      - "3200:3200"
    command: ["-config.file=/etc/tempo.yaml"]

  temporal:
    image: ${REGISTRY:-localhost:32443/ai-crew-suite}/workbench-temporal:${IMAGE_TAG:-latest}
    ports:
      - "${TEMPORAL_PORT:-7233}:${TEMPORAL_FRONTEND_PORT:-7233}"
      - "${TEMPORAL_MEMBERSHIP_PORT:-6933}:${TEMPORAL_FRONTEND_MEMBERSHIP_PORT:-6933}"
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage_secret_pass}
      TEMPORAL_FRONTEND_PORT: ${TEMPORAL_FRONTEND_PORT:-7233}
      TEMPORAL_FRONTEND_MEMBERSHIP_PORT: ${TEMPORAL_FRONTEND_MEMBERSHIP_PORT:-6933}
      TEMPORAL_HISTORY_PORT: ${TEMPORAL_HISTORY_PORT:-7234}
      TEMPORAL_HISTORY_MEMBERSHIP_PORT: ${TEMPORAL_HISTORY_MEMBERSHIP_PORT:-6934}
      TEMPORAL_MATCHING_PORT: ${TEMPORAL_MATCHING_PORT:-7235}
      TEMPORAL_MATCHING_MEMBERSHIP_PORT: ${TEMPORAL_MATCHING_MEMBERSHIP_PORT:-6935}
      TEMPORAL_WORKER_PORT: ${TEMPORAL_WORKER_PORT:-7236}
      TEMPORAL_WORKER_MEMBERSHIP_PORT: ${TEMPORAL_WORKER_MEMBERSHIP_PORT:-6936}
      TEMPORAL_METRICS_PORT: 9090
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost $${TEMPORAL_FRONTEND_PORT:-7233}"]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 5s

  wiremock:
    image: wiremock/wiremock:3.13.2-alpine
    ports:
      - "${WIREMOCK_PORT:-8080}:8080"
    volumes:
      - ${PROJECT_DIR:-.}/wiremock/mappings:/home/wiremock/mappings
      - ${PROJECT_DIR:-.}/wiremock/__files:/home/wiremock/__files
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: >
      --global-response-templating
      --async-response-enabled=true
      --enable-cors
      --enable-extensions io.github.wiremock.extension.opentel.OpenTelemetryExtension
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_volume:
    name: crew_platform_pgdata_${IMAGE_TAG:-latest}
  redis_volume:
    name: crew_platform_redisdata_${IMAGE_TAG:-latest}
