schemaVersion: "2.0.0"

metadataTest:
  exposedPorts: ["7007"]
  user: "0"
  workdir: "/app"
  entrypoint: ["/usr/bin/tini", "--"]
  cmd: ["yarn", "start"]
  envVars:
    - key: "NODE_ENV"
      value: "development"
    - key: "NODE_OPTIONS"
      value: "--no-node-snapshot"

commandTests:
  - name: "Validate Execution Tooling Core"
    command: "node"
    args: ["-v"]
    expectedOutput: ["v22.*"]

  - name: "Validate Process Init Daemon System"
    command: "tini"
    args: ["--version"]
    expectedOutput: ["tini version 0.19.0.*"]

  - name: "Validate Yarn Launcher"
    command: "yarn"
    args: ["--version"]
    expectedOutput: [".+"]

fileExistenceTests:
  - name: "Assert Consumer Workspace Mount Target"
    path: "/app"
    shouldExist: true

  - name: "Assert Dependencies Come From Mounted Workspace"
    path: "/app/node_modules"
    shouldExist: false

  - name: "Assert Compiled Workbench Is Not Baked In"
    path: "/app/packages"
    shouldExist: false

  - name: "Confirm Build Tooling Is Not Installed"
    path: "/usr/bin/g++"
    shouldExist: false
