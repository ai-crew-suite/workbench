vector_store:
  provider: "postgres"
  config:
    collection_name: "mem0_embeddings"
    dbname: "${POSTGRES_DB:-backstage_plugin_catalog}"
    host: "${POSTGRES_HOST:-postgres-store}"
    password: "${POSTGRES_PASSWORD:-backstage_secret_pass}"
    port: ${POSTGRES_PORT:-5432}
    user: "${POSTGRES_USER:-backstage}"

llm:
  provider: "${MEM0_LLM_PROVIDER:-openai}"
  config:
    api_key: "${MEM0_PROVIDER_API_KEY:-}"
    max_tokens: ${MEM0_LLM_MAX_TOKENS:-2000}
    model: "${MEM0_LLM_MODEL:-gpt-4o-mini}"
    temperature: ${MEM0_LLM_TEMPERATURE:-0.1}

embedder:
  provider: "${MEM0_EMBEDDER_PROVIDER:-openai}"
  config:
    api_key: "${MEM0_PROVIDER_API_KEY:-}"
    model: "${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}"

version: "v1.1"
