log:
  stdout: true
  level: ${TEMPORAL_LOG_LEVEL_JSON}

persistence:
  defaultStore: postgres-default
  visibilityStore: postgres-visibility
  numHistoryShards: 512

  datastores:
    postgres-default:
      sql:
        pluginName: "postgres12"
        databaseName: ${POSTGRES_DB_JSON}
        user: ${POSTGRES_USER_JSON}
        password: ${POSTGRES_PASSWORD_JSON}
        connectAddr: ${POSTGRES_ADDR_JSON}
        connectProtocol: "tcp"
        maxConns: 20
        maxIdleConns: 10
        maxConnLifetime: "1h"
    postgres-visibility:
      sql:
        pluginName: "postgres12"
        databaseName: ${TEMPORAL_VISIBILITY_DB_JSON}
        user: ${POSTGRES_USER_JSON}
        password: ${POSTGRES_PASSWORD_JSON}
        connectAddr: ${POSTGRES_ADDR_JSON}
        connectProtocol: "tcp"
        maxConns: 10
        maxIdleConns: 5
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"
  metrics:
    prometheus:
      listenAddress: "0.0.0.0:${TEMPORAL_METRICS_PORT}"
      handlerPath: "/metrics"

services:
  frontend:
    rpc:
      grpcPort: ${TEMPORAL_FRONTEND_PORT}
      membershipPort: ${TEMPORAL_FRONTEND_MEMBERSHIP_PORT}
      bindOnIP: "0.0.0.0"
  history:
    rpc:
      grpcPort: ${TEMPORAL_HISTORY_PORT}
      membershipPort: ${TEMPORAL_HISTORY_MEMBERSHIP_PORT}
      bindOnIP: "0.0.0.0"
  matching:
    rpc:
      grpcPort: ${TEMPORAL_MATCHING_PORT}
      membershipPort: ${TEMPORAL_MATCHING_MEMBERSHIP_PORT}
      bindOnIP: "0.0.0.0"
  worker:
    rpc:
      grpcPort: ${TEMPORAL_WORKER_PORT}
      membershipPort: ${TEMPORAL_WORKER_MEMBERSHIP_PORT}
      bindOnIP: "0.0.0.0"

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "127.0.0.1:${TEMPORAL_FRONTEND_PORT}"
