apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app: backstage
    environment: {{ .Values.global.environment }}
spec:
  replicas: {{ .Values.backstage.replicaCount }}
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage-node
          image: "{{ .Values.backstage.image.repository }}:{{ .Values.backstage.image.tag }}"
          imagePullPolicy: {{ .Values.backstage.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP

          # Injected runtime production configs
          env:
            - name: APP_BASE_URL
              value: {{ .Values.backstage.config.baseUrl | quote }}
            - name: DB_HOST
              value: {{ .Values.backstage.config.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.backstage.config.dbPort | quote }}
            - name: MOCK_PROXY_URL
              value: {{ .Values.backstage.config.mockProxyUrl | quote }}
            - name: MOCK_FIXTURES_PATH
              value: {{ .Values.backstage.config.mockDataPath | quote }}

          envFrom:
            - secretRef:
                name: {{ .Values.backstage.envFromSecret }}

          # 🛡️ SOC 2 Security Health Checking Guardrails
          livenessProbe:
            httpGet:
              path: /health
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 7007
            initialDelaySeconds: 15
            periodSeconds: 5

          resources:
            {{- toYaml .Values.backstage.resources | nindent 12 }}
