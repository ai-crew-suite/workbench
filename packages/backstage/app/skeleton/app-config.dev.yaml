app:
  title: AI Crew Suite Dev App
  baseUrl: http://${APP_HOST:-localhost}:${APP_PORT:-3000}

backend:
  baseUrl: http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-7007}
  cors:
    origin: http://${APP_HOST:-localhost}:${APP_PORT:-3000}

proxy:
  endpoints:
    '/api':
      target: http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-7007}
      changeOrigin: true
      secure: false

catalog:
  import:
    entityFilename: catalog-info.yaml
