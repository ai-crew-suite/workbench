# yaml-language-server: https://json.schemastore.org/app-config.json
# ====================================================================================
# 🛡️ UNIFIED COMPLIANCE CONFIGURATION LAYER (ADAPTIVE SANDBOX PROFILE)
# Frameworks: SOC 2 Type II System Isolation | Variable-Driven Workstation Freedom
# ====================================================================================
app:
  title: AI Crew Suite Platform
  baseUrl: http://${APP_HOST:-localhost}:${APP_PORT:-3000}

organization:
  name: AI Crew Suite

backend:
  baseUrl: http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-7007}

  logger:
    level: debug

  listen:
    port: ${BACKEND_PORT:-7007}

  auth:
    allowGuestAccess: true
    externalAccess:
      - type: static
        options:
          token: ${BACKEND_STATIC_TOKEN:-dev-secret-token-placeholder}
          subject: development-tester-agent

  cors:
    origin:
      - http://${APP_HOST:-localhost}:${APP_PORT:-3000}
      - http://localhost:3000
      - http://127.0.0.1:3000
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    allowedHeaders: [Content-Type, Authorization, X-Requested-With]
    credentials: true

  database:
    client: better-sqlite3
    connection: ':memory:'
    plugin:
      auth:
        client: better-sqlite3
        connection: ':memory:'
      notifications:
        client: better-sqlite3
        connection: ':memory:'
      scaffolder:
        client: better-sqlite3
        connection: ':memory:'
      signals:
        client: better-sqlite3
        connection: ':memory:'

  # 🔒 Strict Network Sandbox: Enforces absolute dark-site testing within the AWS VPC
  reading:
    allow:
      - host: "${ALLOWED_HOST:-localhost}"

# ====================================================================================
# 🛡️ CI STAGING/TESTING CONFIGURATION BLUEPRINT (AIR-GAPPED ENVIRONMENT)
# ====================================================================================

catalog:
  rules:
    - allow: [
        API,
        ArchitectureDecision,
        Component,
        DataProduct,
        Domain,
        Group,
        Location,
        Model,
        Product,
        Resource,
        System,
        Template,
        User,
        Vulnerability,
      ]
  locations:
    - type: file
      target: "${MOCK_FIXTURES_PATH:-../../fixtures}/location.yaml"

    - type: "${CONSUMER_CATALOG_TYPE:-file}"
      target: "${CONSUMER_CATALOG_TARGET:-../backend/skeleton/empty-fallback.yaml}"

