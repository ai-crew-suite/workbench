approvedGitRepositories: []

catalogs:
  dev:
    "@ai-crew-suite/crew-cli": ^0.0.6
    "@ai-crew-suite/typescript-shared-config": ^0.0.4
    "@backstage/cli": ^0.36.6
    "@playwright/test": ^1.64.0
    "@testing-library/dom": ^10.4.2
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/react": ^14.3.1
    "@testing-library/user-event": ^14.6.7
    "@tsconfig/node22": ^22.0.6
    "@types/node": ^22.20.5
    "@types/react": ^18.3.31
    "@types/react-dom": ^18.3.7
    esbuild: ^0.28.2
    prettier: ^3.9.0
    turbo: ^2.11.4
    typescript: ^6.0.3
    vitest: ^5.0.3
  prod:
    "@backstage/cli": ^0.36.6
    "@emotion/react": ^11.14.0
    "@emotion/styled": ^11.14.1
    "@material-ui/core": ^4.12.4
    "@material-ui/icons": ^4.11.3
    "@mui/material": ^7.3.11
    "@rjsf/utils": ^6.11.0
    express: ^4.22.3
    express-promise-router: ^4.1.1
    i18next: ^23.16.8
    lodash: ^4.18.1
    prop-types: ^15.8.1
    react: ^18.3.1
    react-dom: ^18.3.1
    react-router: ^6.30.6
    react-router-dom: ^6.30.6
    use-sync-external-store: ^1.7.0
    winston: ^3.15.0

enableGlobalCache: false

enableHardenedMode: true

enableScripts: false

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0056
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

npmAlwaysAuth: false

npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - "@ai-crew-suite/*"

npmRegistryServer: "https://registry.npmjs.org"

packageExtensions:
  "@backstage/cli-module-build@*":
    dependencies:
      esbuild: "catalog:dev"
  "@backstage/cli-module-test-jest@*":
    dependencies:
      "@jest/environment-jsdom-abstract": "*"
      jest-environment-node: "*"
      jest-runtime: "*"
      jsdom: "*"
      yaml: "*"
  "@backstage/plugin-app@*":
    dependencies:
      "@backstage/config": "backstage:^"
      "@backstage/core-app-api": "backstage:^"
      i18next: "catalog:prod"
      lodash: "catalog:prod"
      prop-types: "catalog:prod"
      use-sync-external-store: "catalog:prod"
  "@backstage/plugin-catalog-react@*":
    dependencies:
      "@emotion/react": "catalog:prod"
      "@emotion/styled": "catalog:prod"
      "@mui/material": "catalog:prod"
  "@backstage/plugin-permission-react@*":
    dependencies:
      react-router: "catalog:prod"
      react-router-dom: "catalog:prod"
  vitest@*:
    dependencies:
      "@types/node": "*"

plugins:
  - checksum: e036bbabee4fda5a34aed96597e1fa22a0fc753bc7737c525c1b7e37d626f4894e71a01fe7440458a3d034b7f9e648c394cebfb3b47a75b731b16e5b8d50fe60
    path: .yarn/plugins/@yarnpkg/plugin-backstage.cjs
    spec: "https://versions.backstage.io/v1/releases/1.55.3/yarn-plugin"

unsafeHttpWhitelist: []

yarnPath: .yarn/releases/yarn-4.18.1.cjs
