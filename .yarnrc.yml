enableGlobalCache: false

enableHardenedMode: true

enableScripts: false

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0056
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

npmAlwaysAuth: false

npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - "@ai-crew-suite/*"

npmRegistryServer: "https://registry.npmjs.org"

packageExtensions:
  vitest@*:
    dependencies:
      "@types/node": "catalog:dev"

plugins:
  - checksum: e036bbabee4fda5a34aed96597e1fa22a0fc753bc7737c525c1b7e37d626f4894e71a01fe7440458a3d034b7f9e648c394cebfb3b47a75b731b16e5b8d50fe60
    path: .yarn/plugins/@yarnpkg/plugin-backstage.cjs
    spec: "https://versions.backstage.io/v1/releases/1.55.3/yarn-plugin"

unsafeHttpWhitelist: []

yarnPath: .yarn/releases/yarn-4.18.1.cjs
