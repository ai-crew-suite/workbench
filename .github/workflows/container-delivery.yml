name: Container Compilation & Delivery Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source tree
        uses: actions/checkout@v4

      - name: Initialize Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install Sigstore Cosign Compiler Utility
        uses: sigstore/cosign-installer@v3.7.0
        with:
          # Pinned to match local workstations; cosign v3 rejects the legacy --tlog-upload=false flag without --use-signing-config=false
          version: v3.1.3

      - name: Install Monorepo Package Dependencies
        run: yarn install --immutable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Compile all independent container packages sequentially into local runner engine storage
      - name: Build All Container Workspaces Locally
        env:
          REGISTRY: local
          IMAGE_TAG: latest
          CI: "false" # Directs build action to use --load strategy for downstream validation stages
        run: yarn turbo run build --filter="...{packages/deploy/containers/*}"

      # 2. Reify external execution providers and verify structural / functional compliance
      - name: Install container-structure-test binary
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
          container-structure-test version

      - name: Execute Container Structure Assertion Matrix
        run: yarn turbo run image:test:structure --filter="...{packages/deploy/containers/*}"

      - name: Execute Integration Smoke Test Specs
        run: yarn turbo run image:test:unit --filter="...{packages/deploy/containers/*}"

      # 3. Authenticate, retag with dynamic OCI annotations, sign layers, and distribute to GHCR
      - name: Authenticate against GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and Cryptographically Sign Verified Container Packages
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: latest
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: yarn turbo run publish --filter="...{packages/deploy/containers/*}"
