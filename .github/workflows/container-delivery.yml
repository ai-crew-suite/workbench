name: Container Compilation & Delivery Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "yarn"

      - name: Install Monorepo Package Dependencies
        run: yarn install --immutable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1. Compile images locally into the runner's engine storage (--load strategy)
      - name: Build Container Stack Locally
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: test-${{ github.sha }}
          CI: "false" # Forces the build script to use --load instead of --push
        run: yarn workspace @ai-crew-suite/containers build

      # 2. Run the integration readiness probes
      - name: Install container-structure-test binary
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
          container-structure-test version

      - name: Execute Container Validation Suite via Turborepo
        run: yarn turbo run image:test:structure

      # 3. If the smoke test passes successfully, log into GHCR and distribute the artifacts
      - name: Authenticate against GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Verified Containers to GHCR
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: latest
          CI: "true" # Triggers the build.sh build action to change to --push
        run: yarn workspace @ai-crew-suite/containers build
