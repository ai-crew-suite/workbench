name: Container Compilation & Delivery Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # MANDATORY: Allows the runner to request the GitHub OIDC identity token

    steps:
      - name: Check out source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install Sigstore Cosign Compiler Utility
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install Monorepo Package Dependencies
        run: yarn install --immutable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 0. Authenticate against Docker Hub before any build runs. The image build service
      #    forwards these credentials as the daemon auth header so base-image pulls use
      #    the account's dedicated quota instead of shared per-IP anonymous limits that
      #    CI runner address blocks routinely exhaust. login-action writes the token into
      #    ~/.docker/config.json, which the build service resolves automatically.
      #    Requires repository secrets: DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN
      #    (a Docker Hub personal access token, not the account password).
      - name: Authenticate against Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 1. Compile all independent container packages sequentially into local runner engine storage
      - name: Build All Container Workspaces Locally
        env:
          REGISTRY: local
          IMAGE_TAG: latest
          CI: "false" # Directs build action to use --load strategy for downstream validation stages
        run: yarn turbo run build --filter="...{packages/deploy/containers/*}"

      # 2. Reify external execution providers and verify structural / functional compliance
      - name: Install container-structure-test binary
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
          container-structure-test version

      - name: Execute Container Structure Assertion Matrix
        run: yarn turbo run image:test:structure --filter="...{packages/deploy/containers/*}"

      - name: Execute Integration Smoke Test Specs
        run: yarn turbo run image:test:unit --filter="...{packages/deploy/containers/*}"

      # 3. Authenticate, retag with dynamic OCI annotations, sign layers, and distribute to GHCR.
      #    This login also feeds the dockerode-based publish push (registry credentials are
      #    resolved from ~/.docker/config.json) and the keyless cosign signature uploads.
      - name: Authenticate against GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and Cryptographically Sign Verified Container Packages
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: latest
          # FIXED: Bypassed COSIGN_PRIVATE_KEY and COSIGN_PASSWORD.
          # Bypassing these forces our publish script's "cosign sign" command to run in keyless mode.
        run: yarn turbo run publish --filter="...{packages/deploy/containers/*}"
